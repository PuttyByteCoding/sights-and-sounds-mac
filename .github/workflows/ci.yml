name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  terminology:
    name: Terminology guard
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Banned-words check
        run: ./scripts/check-terminology.sh

  test:
    name: Build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
